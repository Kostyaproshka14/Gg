<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PM AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
html,body{height:100%;background:#0b0d13;color:#f3f4f6;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#121622;border-bottom:1px solid #22283a;gap:6px}
.brand{font-weight:800;font-size:17px;background:linear-gradient(90deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.controls{display:flex;gap:5px}
button{background:#1c2233;color:#fff;border:1px solid #2d354d;padding:7px 9px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
button.active{background:linear-gradient(135deg,#f97316,#dc2626);border-color:transparent}
#langBtn{border-color:#f97316;color:#fb923c}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:14px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:linear-gradient(135deg,#f97316,#dc2626);color:#fff}
.bot{align-self:flex-start;background:#161b29;border:1px solid #252c40}
.bot img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.bar{flex-shrink:0;display:flex;gap:8px;padding:10px 12px;background:#121622;border-top:1px solid #22283a}
input{flex:1;min-width:0;background:#1a2030;border:1px solid #2a3248;color:#fff;padding:12px 14px;border-radius:10px;font-size:15px;outline:none}
#send{background:linear-gradient(135deg,#f97316,#dc2626);border:none;padding:0 18px;font-size:16px}
</style>
</head>
<body>
<header>
  <div class="brand">👑 PM AI</div>
  <div class="controls">
    <button type="button" id="mChat" class="active" onclick="setMode('chat')">💬 Чат</button>
    <button type="button" id="mImg" onclick="setMode('img')">🎨 Арт</button>
    <button type="button" id="langBtn" onclick="toggleLang()">🌐 RU</button>
    <button type="button" onclick="clearChat()">🗑️</button>
  </div>
</header>
<div id="chat">
  <div class="msg bot" id="welcome">Привет! Я <b>PM AI</b> на базе GPT-4o mini. Задай любой вопрос (я помню контекст диалога!) или выбери <b>🎨 Арт</b>.</div>
</div>
<div class="bar">
  <input id="q" placeholder="Напиши сообщение..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()">
  <button type="button" id="send" onclick="sendMsg()">➤</button>
</div>
<script>
let mode='chat';
let lang='ru';
const i18n={
  ru:{
    chat:'💬 Чат',img:'🎨 Арт',lang:'🌐 RU',ph:'Напиши сообщение...',
    welcome:'Привет! Я <b>PM AI</b> на базе GPT-4o mini. Задай любой вопрос (я помню контекст диалога!) или выбери <b>🎨 Арт</b>.',
    cleared:'Контекст очищен. Чем помочь?',think:'⏳ Думаю...',draw:'🎨 Рисую...',
    done:'Готово:',imgErr:'Не удалось загрузить картинку.',empty:'Пустой ответ, попробуй ещё раз.',
    netErr:'Нет связи с ИИ — проверь интернет или VPN.',
    sys:'Ты PM AI — умный и дружелюбный ИИ-помощник на базе GPT-4o mini. Отвечай чётко, по делу и на русском языке.'
  },
  en:{
    chat:'💬 Chat',img:'🎨 Image',lang:'🌐 EN',ph:'Ask anything or describe an image...',
    welcome:'Hi! I am <b>PM AI</b> powered by GPT-4o mini. Ask me anything (I remember context!) or switch to <b>🎨 Image</b>.',
    cleared:'Chat cleared. How can I help?',think:'⏳ Thinking...',draw:'🎨 Generating...',
    done:'Done:',imgErr:'Failed to load image.',empty:'Empty response, please try again.',
    netErr:'Connection error — check your internet or VPN.',
    sys:'You are PM AI, a smart and helpful AI assistant powered by GPT-4o mini. Reply clearly and concisely in English.'
  }
};
let history=[{role:'system',content:i18n.ru.sys}];

function setMode(m){
  mode=m;
  document.getElementById('mChat').className=m==='chat'?'active':'';
  document.getElementById('mImg').className=m==='img'?'active':'';
}

function toggleLang(){
  lang=lang==='ru'?'en':'ru';
  const t=i18n[lang];
  document.getElementById('mChat').textContent=t.chat;
  document.getElementById('mImg').textContent=t.img;
  document.getElementById('langBtn').textContent=t.lang;
  document.getElementById('q').placeholder=t.ph;
  history=[{role:'system',content:t.sys}];
  document.getElementById('chat').innerHTML='<div class="msg bot">'+t.welcome+'</div>';
}

function clearChat(){
  const t=i18n[lang];
  history=[{role:'system',content:t.sys}];
  document.getElementById('chat').innerHTML='<div class="msg bot">'+t.cleared+'</div>';
}

async function sendMsg(){
  const t=i18n[lang];
  const inp=document.getElementById('q');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  const chat=document.getElementById('chat');
  const u=document.createElement('div');
  u.className='msg user';
  u.textContent=text;
  chat.appendChild(u);
  const bot=document.createElement('div');
  bot.className='msg bot';
  bot.textContent=mode==='img'?t.draw:t.think;
  chat.appendChild(bot);
  chat.scrollTop=chat.scrollHeight;
  if(mode==='img'){
    const url='https://pollinations.ai(Math.random()*99999);
    bot.innerHTML=t.done+'<img src="'+url+'" onload="document.getElementById(\'chat\').scrollTop=999999" onerror="this.parentElement.textContent=\''+t.imgErr+'\'">';
    return;
  }
  history.push({role:'user',content:text});
  try{
    const res=await fetch('https://pollinations.ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'openai',messages:history.slice(-12)})
    });
    const data=await res.json();
    const reply=data.choices?.?.message?.content;
    if(reply){
      bot.textContent=reply;
      history.push({role:'assistant',content:reply});
    }else{
      bot.textContent=t.empty;
    }
  }catch(e){
    bot.textContent=t.netErr;
  }
  chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
