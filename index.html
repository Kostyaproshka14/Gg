<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PM AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
html,body{height:100%;background:#0b0d13;color:#f3f4f6;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#121622;border-bottom:1px solid #22283a}
.brand{font-weight:800;font-size:18px;background:linear-gradient(90deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.controls{display:flex;gap:8px}
button{background:#1c2233;color:#fff;border:1px solid #2d354d;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
button.active{background:linear-gradient(135deg,#f97316,#dc2626);border-color:transparent}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:11px 14px;border-radius:14px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:linear-gradient(135deg,#f97316,#dc2626);color:#fff}
.bot{align-self:flex-start;background:#161b29;border:1px solid #252c40}
.bot img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.bar{flex-shrink:0;display:flex;gap:8px;padding:10px 12px;background:#121622;border-top:1px solid #22283a}
input{flex:1;min-width:0;background:#1a2030;border:1px solid #2a3248;color:#fff;padding:12px 14px;border-radius:10px;font-size:15px;outline:none}
#send{background:linear-gradient(135deg,#f97316,#dc2626);border:none;padding:0 18px;font-size:16px}
</style>
</head>
<body>
<header>
  <div class="brand">👑 PM AI</div>
  <div class="controls">
    <button type="button" id="mChat" class="active" onclick="setMode('chat')">💬 Чат</button>
    <button type="button" id="mImg" onclick="setMode('img')">🎨 Арт</button>
  </div>
</header>
<div id="chat">
  <div class="msg bot">Привет! Я <b>PM AI</b> — универсальный ИИ-помощник. Напиши запрос внизу или выбери <b>🎨 Арт</b>.</div>
</div>
<div class="bar">
  <input id="q" placeholder="Напиши запрос..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()">
  <button type="button" id="send" onclick="sendMsg()">➤</button>
</div>
<script>
let mode='chat';
function setMode(m){
  mode=m;
  document.getElementById('mChat').className=m==='chat'?'active':'';
  document.getElementById('mImg').className=m==='img'?'active':'';
}
async function sendMsg(){
  const inp=document.getElementById('q');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  const chat=document.getElementById('chat');
  const u=document.createElement('div');
  u.className='msg user';
  u.textContent=text;
  chat.appendChild(u);
  const bot=document.createElement('div');
  bot.className='msg bot';
  bot.textContent=mode==='img'?'🎨 Рисую...':'⏳ Думаю...';
  chat.appendChild(bot);
  chat.scrollTop=chat.scrollHeight;
  if(mode==='img'){
    const url='https://pollinations.ai(Math.random()*99999);
    bot.innerHTML='Готово:<img src="'+url+'" onload="document.getElementById(\'chat\').scrollTop=999999" onerror="this.parentElement.textContent=\'Не удалось загрузить картинку.\'">';
    return;
  }
  try{
    const res=await fetch('https://pollinations.ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'openai',messages:[{role:'user',content:text}]})
    });
    const data=await res.json();
    bot.textContent=data.choices?.[0]?.message?.content||'Нет ответа, попробуй ещё раз.';
  }catch(e){
    bot.textContent='Ошибка соединения — проверь интернет или VPN.';
  }
  chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
